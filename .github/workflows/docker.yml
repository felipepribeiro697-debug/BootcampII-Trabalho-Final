name: Docker - Imagem

# Em toda PR: gera a imagem e testa o "docker run" (nao publica).
# No merge para a main: gera, testa e publica no Docker Hub.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  IMAGEM: steverogers03/helpdesk-kanban

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Gerar a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGEM }}:latest

      - name: Testar o docker run (maquina limpa)
        run: |
          docker run -d --name helpdesk -p 3000:3000 -v helpdesk-dados:/app/data "$IMAGEM:latest"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/saude; then
              echo
              echo "API respondeu em /api/saude"
              curl -fsS -o /dev/null -w "Pagina inicial: HTTP %{http_code}\n" http://localhost:3000/
              docker logs helpdesk
              exit 0
            fi
            sleep 1
          done
          echo "A aplicacao nao respondeu em 30 segundos"
          docker logs helpdesk
          exit 1

      - name: Login no Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: steverogers03
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar no Docker Hub
        if: github.event_name == 'push'
        run: |
          docker tag "$IMAGEM:latest" "$IMAGEM:${GITHUB_SHA::7}"
          docker push "$IMAGEM:latest"
          docker push "$IMAGEM:${GITHUB_SHA::7}"
